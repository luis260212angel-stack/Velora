<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Velora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ivory:#f4efe8;--cream:#e8dfd3;--sand:#c4b5a0;--ink:#161412;
  --ink-soft:#3a342e;--muted:#7a7268;--terracotta:#8b3a2a;
  --terracotta-deep:#6e2c20;--line:#d9cfc2;
  --display:"Cormorant Garamond",Georgia,serif;
  --sans:"Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);line-height:1.5}
button,a,[role=button]{cursor:pointer}
button{font:inherit;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1;text-wrap:balance;margin:0}
p{text-wrap:pretty}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:72rem;margin:0 auto;padding:0 1.25rem}
@media(min-width:640px){.wrap{padding:0 2rem}}
header.nav{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line);background:rgb(244 239 232 / .88);backdrop-filter:blur(14px)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:4rem}
.brand{font-family:var(--display);font-size:1.5rem;font-style:italic}
.nav-links{display:flex;align-items:center;gap:.25rem;font-size:.9rem}
.nav-links a,.icon-btn{display:inline-flex;align-items:center;height:2.75rem;padding:0 .75rem;color:var(--ink-soft)}
.nav-links a.on,.nav-links a:hover{color:var(--terracotta)}
.icon-btn{position:relative;width:2.75rem;justify-content:center;border-radius:999px}
.icon-btn:hover{background:var(--cream)}
.cart-n{position:absolute;top:.35rem;right:.35rem;min-width:1rem;height:1rem;padding:0 .25rem;border-radius:999px;background:var(--terracotta);color:var(--ivory);font-size:.65rem;font-weight:600;display:grid;place-items:center}
.hero{position:relative;min-height:calc(100svh - 4.5rem);background:var(--ink);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.hero-veil{position:absolute;inset:0;background:linear-gradient(to top,rgb(22 20 18 / .7) 0%,rgb(22 20 18 / .28) 48%,rgb(22 20 18 / .1) 100%)}
.hero-copy{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:end;gap:1.25rem;min-height:calc(100svh - 4.5rem);padding:4rem 0}
.kicker{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sand);margin:0}
.hero h1{max-width:20ch;font-size:clamp(2.6rem,7vw,4.5rem);color:var(--ivory)}
.banner{background:var(--ink);color:var(--ivory);border-block:1px solid var(--line);padding:2rem 0}
.banner-inner{display:flex;flex-direction:column;gap:1rem}
@media(min-width:640px){.banner-inner{flex-direction:row;align-items:end;justify-content:space-between}}
.banner h2{font-size:clamp(2rem,4vw,3rem)}
.banner p{color:var(--sand);margin:.75rem 0 0;max-width:36rem;font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:2.75rem;padding:0 1.25rem;border-radius:999px;background:var(--terracotta);color:var(--ivory);font-size:.875rem;font-weight:500}
.btn:hover{background:var(--terracotta-deep)}
.btn.ink{background:var(--ink)}
.btn.ink:hover{background:var(--ink-soft)}
.btn.line{background:transparent;border:1px solid rgb(22 20 18 / .15);color:var(--ink)}
.btn.line:hover{border-color:var(--terracotta);color:var(--terracotta)}
.btn.ghost{background:transparent;color:var(--ink-soft)}
.btn.sm{height:2.25rem;padding:0 1rem;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.btn:disabled{opacity:.4;pointer-events:none}
.split{display:grid;gap:2.5rem;padding:4rem 0}
@media(min-width:960px){.split{grid-template-columns:1fr 1fr;align-items:center}}
.look{overflow:hidden;border-radius:.25rem;background:var(--cream)}
.look img{width:100%;aspect-ratio:3/2;object-fit:cover}
.muted{color:var(--muted);font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;margin:0}
.lead{margin:1rem 0 0;max-width:28rem;color:var(--ink-soft)}
.grid3{display:grid;gap:1.5rem;padding:0 0 4rem}
@media(min-width:640px){.grid3{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid3{grid-template-columns:1fr 1fr 1fr}}
.card{display:flex;flex-direction:column;overflow:hidden;border-radius:.25rem;background:var(--cream)}
.card.sale{box-shadow:0 0 0 2px var(--terracotta),0 0 0 4px var(--ivory)}
.card .pic{position:relative;display:block}
.card .pic img{width:100%;aspect-ratio:3/4;object-fit:cover}
.badge{position:absolute;top:.75rem;left:.75rem;background:var(--terracotta);color:var(--ivory);border-radius:999px;padding:.25rem .65rem;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tag{position:absolute;top:.75rem;left:.75rem;background:rgb(244 239 232 / .9);border-radius:999px;padding:.25rem .65rem;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.card-body{display:flex;flex-direction:column;gap:.75rem;padding:1rem;flex:1}
.card-body h3{font-size:1.5rem}
.price{display:flex;gap:.5rem;align-items:baseline}
.old{text-decoration:line-through;color:var(--muted);font-size:.875rem}
.now{color:var(--ink-soft)}
.sale .now{color:var(--terracotta);font-weight:600}
.cream-band{background:var(--cream);border-top:1px solid var(--line)}
footer.site{background:var(--cream);border-top:1px solid var(--line)}
footer.site .grid{display:grid;gap:2.5rem;padding:3.5rem 0}
@media(min-width:960px){footer.site .grid{grid-template-columns:1fr 1fr}}
.socials{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem;padding:0;list-style:none}
.socials a{display:inline-flex;align-items:center;gap:.5rem;height:2.75rem;padding:0 1rem;border-radius:999px;border:1px solid rgb(22 20 18 / .1);background:var(--ivory);font-size:.875rem}
.socials a:hover{border-color:var(--terracotta);color:var(--terracotta)}
.map{position:relative;overflow:hidden;border-radius:.25rem;border:1px solid var(--line);background:var(--ivory);min-height:16rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem;gap:.75rem}
.map-grid{position:absolute;inset:0;background-color:var(--cream);background-image:linear-gradient(to right,rgb(139 58 42 / .08) 1px,transparent 1px),linear-gradient(to bottom,rgb(139 58 42 / .08) 1px,transparent 1px);background-size:28px 28px}
.map .pin{position:relative;width:3rem;height:3rem;border-radius:999px;background:var(--terracotta);color:var(--ivory);display:grid;place-items:center}
.foot-mini{border-top:1px solid var(--line);padding:1rem;text-align:center;font-size:.75rem;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:50;background:rgb(22 20 18 / .45)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,28rem);background:var(--ivory);z-index:51;display:flex;flex-direction:column;box-shadow:0 25px 50px rgb(0 0 0 / .2)}
.drawer header,.modal header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:1rem 1.25rem}
.drawer footer{border-top:1px solid var(--line);padding:1.25rem;display:grid;gap:.75rem}
.line{display:flex;gap:.75rem;margin-bottom:1rem}
.thumb{width:5rem;height:5rem;border-radius:.25rem;overflow:hidden;background:var(--cream);flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.qty{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.qty button{width:2.25rem;height:2.25rem;border-radius:999px;border:1px solid var(--line)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,40rem);max-height:90svh;overflow:auto;background:var(--ivory);z-index:52;border-radius:.75rem;padding:1.25rem;box-shadow:0 25px 50px rgb(0 0 0 / .25)}
.modal-grid{display:grid;gap:1.25rem}
@media(min-width:640px){.modal-grid{grid-template-columns:1fr 1fr}}
.studio{max-width:48rem;margin:0 auto;padding:2.5rem 1.25rem 8rem}
.studio h1{font-size:3rem;margin-top:.75rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:2rem 0}
@media(min-width:640px){.stats{grid-template-columns:1fr 1fr 1fr 1fr}}
.stat{border:1px solid var(--line);background:var(--cream);border-radius:.25rem;padding:.75rem 1rem}
.stat b{display:block;font-family:var(--display);font-size:1.75rem;font-weight:500}
.section{border-top:1px solid var(--line);padding-top:2rem;margin-top:2.5rem;display:grid;gap:1rem}
label.f{display:grid;gap:.4rem;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.f input,.f textarea,.f select{height:2.75rem;border:1px solid var(--line);background:var(--ivory);padding:0 .75rem;border-radius:.25rem;outline:none}
.f textarea{height:auto;min-height:5rem;padding:.6rem .75rem;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--terracotta)}
.row2{display:grid;gap:.75rem}
@media(min-width:640px){.row2{grid-template-columns:1fr 1fr}}
.editor{border:1px solid var(--line);border-radius:.25rem;padding:1rem;display:grid;gap:1rem;background:var(--ivory)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--line);background:rgb(244 239 232 / .95);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.hidden{display:none !important}
.empty{text-align:center;color:var(--muted);padding:3rem .5rem}
.page-pad{padding:3rem 0}
.themes{display:flex;flex-wrap:wrap;gap:.5rem}
.themes button{height:2.5rem;padding:0 1rem;border-radius:999px;border:1px solid var(--line);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.themes button.on{background:var(--terracotta);border-color:var(--terracotta);color:var(--ivory)}
.switch{display:flex;align-items:center;justify-content:space-between;background:var(--cream);padding:.5rem .75rem;border-radius:.25rem}
.img-row{display:flex;gap:.75rem}
.prev{width:6rem;height:6rem;border-radius:.25rem;border:1px solid var(--line);background:var(--cream);overflow:hidden;flex-shrink:0}
.prev img{width:100%;height:100%;object-fit:cover}
.hint{font-size:.8rem;color:var(--ink-soft)}
.file-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="#inicio" data-brand>Velora</a>
    <nav class="nav-links">
      <a href="#inicio" data-nav="inicio">Inicio</a>
      <a href="#ropa" data-nav="ropa">Ropa</a>
      <button class="icon-btn" id="openCart" aria-label="Abrir carrito">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-n hidden" id="cartCount">0</span>
      </button>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site" id="siteFooter">
  <div class="wrap grid" id="footerInner"></div>
  <div class="foot-mini"><a href="#estudio" id="studioLink">Estudio</a> · <span data-brand>Velora</span></div>
</footer>

<div id="cartUi"></div>
<div id="modalUi"></div>

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key) || "null"); return v ?? fallback; }
  catch { return fallback; }
}
function save(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

let state = load(KEY.state, structuredClone(SEED));
let cart = load(KEY.cart, []);
let stats = load(KEY.stats, { uniqueVisitors: 0, pageViews: 0, cartAdds: 0, whatsappOrders: 0 });
let orders = load(KEY.orders, []);

let modalId = null;
let toastTimer = 0;

if (!sessionStorage.getItem(KEY.session)) {
  sessionStorage.setItem(KEY.session, "1");
  stats.pageViews += 1;
  if (!localStorage.getItem(KEY.visitor)) {
    localStorage.setItem(KEY.visitor, crypto.randomUUID());
    stats.uniqueVisitors += 1;
  }
  save(KEY.stats, stats);
}

function mx(n) {
  return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 }).format(n);
}
function sale(p) { return Math.round(p.price * (1 - Math.min(100, Math.max(0, p.discount || 0)) / 100)); }
function visible() { return (state.products || []).filter(p => !p.hidden); }
function ranked() { return [...visible()].sort((a,b) => (b.discount>0) - (a.discount>0)); }
function page() {
  const h = (location.hash || "#inicio").replace("#","");
  if (h.startsWith("estudio")) return "estudio";
  if (h.startsWith("ropa") || h.startsWith("promociones")) return "ropa";
  return "inicio";
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&","<":"<",">":">",'"':""","'":"&#39;" }[c]));
}
function toast(msg) {
  clearTimeout(toastTimer);
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:.7rem 1.1rem;border-radius:999px;font-size:.8rem;z-index:80";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove("hidden");
  toastTimer = setTimeout(() => el.classList.add("hidden"), 2200);
}

function renderNav() {
  document.querySelectorAll("[data-brand]").forEach(el => el.textContent = state.home.brand);

  document.querySelector('[data-nav="ropa"]').textContent = state.labels.catalog;
  document.getElementById("studioLink").textContent = state.labels.studio;
  const n = cart.reduce((s,i) => s + i.qty, 0);
  const badge = document.getElementById("cartCount");
  badge.textContent = n;
  badge.classList.toggle("hidden", n === 0);
  const p = page();
  document.querySelector('[data-nav="inicio"]').classList.toggle("on", p === "inicio");
  document.querySelector('[data-nav="ropa"]').classList.toggle("on", p === "ropa");
  document.getElementById("siteFooter").classList.toggle("hidden", p === "estudio");
}

function bannerHTML() {
  const b = state.banner;
  if (!b.enabled) return "";
  const kicker = { rebajas:"Rebajas", navidad:"Navidad", verano:"Verano", custom:"Aviso" }[b.theme] || "Aviso";
  return `<section class="banner"><div class="wrap banner-inner"><div><p class="kicker">${esc(kicker)}</p><h2>${esc(b.title)}</h2><p>${esc(b.subtitle)}</p></div>${b.cta?`<a class="btn" href="#ropa">${esc(b.cta)}</a>`:""}</div></section>`;
}

function cardHTML(p) {
  const on = p.discount > 0;
  return `<article class="card ${on?"sale":""}">
    <button class="pic" data-open="${esc(p.id)}">
      ${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:""}
      ${on?`<span class="badge">-${p.discount}%</span>`:(p.tag?`<span class="tag">${esc(p.tag)}</span>`:"")}
    </button>
    <div class="card-body">
      <button data-open="${esc(p.id)}" style="text-align:left">

        <div class="price">${on?`<span class="old">${mx(p.price)}</span>`:""}<span class="now">${mx(sale(p))}</span></div>
      </button>
      <button class="btn sm ${on?"":"ink"}" data-add="${esc(p.id)}">Añadir al carrito</button>

}

function field(label, path, type="text") {
  const v = path.split(".").reduce((o,k)=>o?.[k], state) ?? "";
  if (type === "textarea") return `<label class="f">${esc(label)}<textarea data-path="${esc(path)}">${esc(v)}</textarea></label>`;
  return `<label class="f">${esc(label)}<input type="${type}" data-path="${esc(path)}" value="${esc(v)}"></label>`;
}
function imgField(label, path) {
  const v = path.split(".").reduce((o,k)=>o?.[k], state) ?? "";
  return `<div><span class="muted">${esc(label)}</span>
    <div class="img-row" style="margin-top:.5rem">
      <div class="prev">${v?`<img src="${v}" alt="">`:""}</div>
      <div style="display:grid;gap:.5rem;align-content:start">
        <div>
          <button class="btn sm ink" data-cam="${esc(path)}">Cámara</button>
          <button class="btn sm line" data-gal="${esc(path)}">Galería</button>
        </div>
        <input class="file-hidden" type="file" accept="image/*" capture="environment" data-file="${esc(path)}" data-cap="1">
        <input class="file-hidden" type="file" accept="image/*" data-file="${esc(path)}">
      </div>
    </div></div>`;
}

function productEditor(p, idx) {
  const prefix = idx < 0 ? "fresh" : `products.${idx}`;
  return `<div class="editor" data-idx="${idx}">
    ${imgField("Foto de la prenda", idx<0?"fresh.image":prefix+".image")}
    <div class="row2">
      <label class="f">Nombre<input data-pp="${idx}" data-k="name" value="${esc(p.name)}"></label>
      <label class="f">Etiqueta<input data-pp="${idx}" data-k="tag" value="${esc(p.tag)}"></label>
    </div>
    <label class="f">Descripción<textarea data-pp="${idx}" data-k="description">${esc(p.description)}</textarea></label>
    <div class="row2">
      <label class="f">Precio (MXN)<input type="number" min="0" data-pp="${idx}" data-k="price" value="${p.price||""}"></label>
      <label class="f">Descuento %<input type="number" min="0" max="100" data-pp="${idx}" data-k="discount" value="${p.discount||""}"></label>
    </div>
    <label class="switch"><span>Ocultar de la tienda</span><input type="checkbox" data-pp="${idx}" data-k="hidden" ${p.hidden?"checked":""}></label>
    ${idx<0?`<button class="btn" id="addFresh">Añadir al estudio</button>`:`<button class="btn ghost" data-remove="${idx}">Quitar</button>`}
  </div>`;
}

function setPath(path, value) {
  const keys = path.split(".");
  let o = state;
  for (let i=0;i<keys.length-1;i++) o = o[keys[i]];
  o[keys[keys.length-1]] = value;
}

            <div style="display:flex;justify-content:space-between"><span class="hint">${esc(o.when)}</span><strong>${mx(o.total)}</strong></div>
            <ul>${o.items.map(it=>`<li>${esc(it.name)} ×${it.qty}</li>`).join("")}</ul>
            <button class="btn line sm" data-hide="${esc(o.id)}" ${o.hiddenApplied?"disabled":""}>${o.hiddenApplied?"Ya ocultas":"Ocultar estas piezas"}</button>
          </div>`).join(""):`<p class="hint">Todavía no hay pedidos.</p>`}
      </section>
      <section class="section"><p class="muted">Cámbiala cuando quieras</p><h2>Contraseña</h2>
        <div class="row2">
          <label class="f">Actual<input type="password" id="curPass"></label>
          <label class="f">Nueva<input type="password" id="newPass"></label>
        </div>
        <button class="btn ink" id="changePass">Cambiar contraseña</button>
      </section>
    </div>
    <div class="sticky"><span class="hint" id="dirtyHint">Edita y pulsa guardar</span><button class="btn" id="saveAll">Guardar cambios</button></div>`;
}

function compressFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = reject;
    img.src = url;
  });
}

function addToCart(id) {
  const found = cart.find(x => x.productId === id);
  if (found) found.qty += 1; else cart.push({ productId: id, qty: 1 });
  save(KEY.cart, cart);
  stats.cartAdds += 1;
  save(KEY.stats, stats);
  cartOpen = true;
  modalId = null;
  render();
}

function waHref() {
  const rows = cart.map(it => {
    const p = state.products.find(x => x.id === it.productId);
    return p ? { p, qty: it.qty } : null;
  }).filter(Boolean);
  if (!rows.length) return "";
  const total = rows.reduce((s,r) => s + sale(r.p) * r.qty, 0);
  const lines = rows.map(r => `• ${r.p.name} ×${r.qty} — ${mx(sale(r.p)*r.qty)}`);
  const msg = `Hola, quiero pedir en ${state.home.brand}:\n\n${lines.join("\n")}\n\nTotal: ${mx(total)}`;
  const digits = (state.contact.whatsapp || state.contact.phone || "").replace(/\D/g,"");
  if (!digits) return "";
  return { href: `https://wa.me/${digits}?text=${encodeURIComponent(msg)}`, rows, total };
}

function persistState() {
  save(KEY.state, state);
  toast("Cambios publicados");
  render();
}

function render() {
  const p = page();
  document.title = state.home.brand;
  renderNav();
  if (p === "inicio") renderHome();
  else if (p === "ropa") renderCatalog();
  else renderStudio();
  if (p !== "estudio") renderFooter();
  renderCart();
  renderModal();
}

document.body.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-open],[data-add],[data-qty],[data-del],[data-theme],[data-remove],[data-cam],[data-gal],[data-addsoc],[data-delsoc],[data-hide],#openCart,#closeCart,#closeCartX,#waBtn,#clearCart,#closeModal,#closeModalX,#addFresh,#saveAll,#lockStudio,#changePass");
  if (!t) return;
  if (t.id === "openCart") { cartOpen = true; renderCart(); renderNav(); return; }
  if (t.id === "closeCart" || t.id === "closeCartX") { cartOpen = false; renderCart(); return; }
  if (t.id === "closeModal" || t.id === "closeModalX") { modalId = null; renderModal(); return; }
  if (t.dataset.open) { modalId = t.dataset.open; renderModal(); return; }
  if (t.dataset.add) { addToCart(t.dataset.add); return; }
  if (t.dataset.qty) {
    const it = cart.find(x => x.productId === t.dataset.qty);
    if (it) it.qty += Number(t.dataset.d);
    cart = cart.filter(x => x.qty > 0);
    save(KEY.cart, cart); renderCart(); renderNav(); return;
  }
  if (t.dataset.del) { cart = cart.filter(x => x.productId !== t.dataset.del); save(KEY.cart, cart); renderCart(); renderNav(); return; }
  if (t.id === "clearCart") { cart = []; save(KEY.cart, cart); renderCart(); renderNav(); return; }
  if (t.id === "waBtn") {
    const pack = waHref();
    if (!pack) { toast("Falta el número de WhatsApp en Estudio"); return; }
    orders.unshift({
      id: crypto.randomUUID(),
      when: new Date().toLocaleString("es-MX"),
      items: pack.rows.map(r => ({ productId: r.p.id, name: r.p.name, qty: r.qty })),
      total: pack.total,
      hiddenApplied: false
    });
    stats.whatsappOrders += 1;
    save(KEY.orders, orders);
    save(KEY.stats, stats);
    window.open(pack.href, "_blank", "noopener,noreferrer");
    return;
  }
  if (t.dataset.theme) { state.banner.theme = t.dataset.theme; renderStudio(); return; }
  if (t.id === "addFresh") {
    if (!fresh.name.trim()) { toast("Ponle un nombre a la prenda"); return; }
    state.products.unshift({ ...fresh, id: "pieza-"+Date.now(), name: fresh.name.trim() });
    fresh = { id:"", name:"", description:"", image:"", price:0, discount:0, hidden:false, tag:"" };
    toast("Prenda en el borrador. Publica con Guardar cambios.");
    renderStudio(); return;
  }
  if (t.dataset.remove) {
    state.products.splice(Number(t.dataset.remove), 1);
    renderStudio(); return;
  }
  if (t.id === "saveAll") { persistState(); return; }
  if (t.id === "lockStudio") { sessionStorage.removeItem(KEY.unlock); location.hash = "#inicio"; return; }
  if (t.id === "changePass") {
    const cur = document.getElementById("curPass").value;
    const nxt = document.getElementById("newPass").value;
    if (cur !== studioPass) { toast("La contraseña actual no coincide"); return; }
    if (nxt.trim().length < 4) { toast("Mínimo 4 caracteres"); return; }
    studioPass = nxt.trim();
    localStorage.setItem(KEY.pass, studioPass);
    toast("Contraseña actualizada");
    return;
  }
  if (t.dataset.addsoc) {
    const id = t.dataset.addsoc;
    if (!state.contact.socials.some(s => s.id === id)) {
      state.contact.socials.push({ id, label: id[0].toUpperCase()+id.slice(1), url: "" });
      renderStudio();
    }
    return;
  }
  if (t.dataset.delsoc) {
    state.contact.socials.splice(Number(t.dataset.delsoc), 1);
    renderStudio(); return;
  }
  if (t.dataset.hide) {
    const o = orders.find(x => x.id === t.dataset.hide);
    if (!o) return;
    const ids = new Set(o.items.map(i => i.productId));
    state.products.forEach(p => { if (ids.has(p.id)) p.hidden = true; });
    o.hiddenApplied = true;
    save(KEY.orders, orders);
    persistState();
    return;
  }
  if (t.dataset.cam || t.dataset.gal) {
    const path = t.dataset.cam || t.dataset.gal;
    const cap = t.dataset.cam ? "[data-cap]" : ":not([data-cap])";
    const input = document.querySelector(`input[data-file="${path}"]${t.dataset.cam?"":":not([data-cap])"}`);
    const all = document.querySelectorAll(`input[data-file="${CSS.escape(path)}"]`);
    (t.dataset.cam ? all[0] : all[1])?.click();
  }
});

document.body.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.path) {
    const val = el.type === "checkbox" ? el.checked : el.value;
    setPath(el.dataset.path, val);
    return;
  }
  if (el.dataset.pp !== undefined) {
    const idx = Number(el.dataset.pp);
    const target = idx < 0 ? fresh : state.products[idx];
    if (!target) return;
    target[el.dataset.k] = el.type === "checkbox" ? el.checked : (el.type === "number" ? Number(el.value)||0 : el.value);
    return;
  }
  if (el.dataset.soc !== undefined) {
    const s = state.contact.socials[Number(el.dataset.soc)];
    if (s) s[el.dataset.sk] = el.value;
  }
});

document.body.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.file && el.files?.[0]) {
    const data = await compressFile(el.files[0]);
    const path = el.dataset.file;
    if (path === "fresh.image") fresh.image = data;
    else setPath(path, data);
    el.value = "";
    renderStudio();
  }
});

document.body.addEventListener("submit", (e) => {
  if (e.target.id === "gate") {
    e.preventDefault();
    const pass = document.getElementById("gatePass").value;
    if (pass !== studioPass) { toast("Contraseña incorrecta"); return; }
    sessionStorage.setItem(KEY.unlock, "1");
    toast("Estudio abierto");
    renderStudio();
  }
});

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
